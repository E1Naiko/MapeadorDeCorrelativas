<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa de Correlativas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.js"></script>
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --ink: #e8eaf0;
    --ink-dim: #8b91a3;
    --accent: #5b8cff;
    --green: #3ecf8e;
    --green-dim: #1f4d3c;
    --amber: #e0a941;
    --amber-dim: #4d3d1a;
    --red: #e0616f;
    --gray: #454c5c;
    --font-display: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);height:100%;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:18px 24px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  header .sub{color:var(--ink-dim);font-size:12.5px;margin-top:3px;font-family:var(--font-mono);}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);align-items:center;}
  .legend .item{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
  .lineswatch{width:18px;height:0;border-top:2px solid;display:inline-block;}

  #main{flex:1;display:flex;min-height:0;}
  #network{flex:1;min-width:0;}

  #sidebar{
    width:300px;
    flex:none;
    border-left:1px solid var(--line);
    background:var(--panel);
    padding:18px;
    overflow-y:auto;
    font-size:13px;
  }
  #sidebar h2{font-family:var(--font-display);font-size:15px;margin:0 0 4px;}
  #sidebar .code{font-family:var(--font-mono);color:var(--accent);font-size:12px;}
  #sidebar .field{margin-top:12px;}
  #sidebar .field label{display:block;color:var(--ink-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
  #sidebar ul{margin:4px 0 0;padding-left:16px;}
  #sidebar li{margin-bottom:3px;}
  #sidebar .empty{color:var(--ink-dim);font-style:italic;margin-top:40px;text-align:center;line-height:1.5;}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-family:var(--font-mono);}

  .controls{
    padding:10px 24px;
    border-bottom:1px solid var(--line);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--panel);
  }
  .controls select, .controls input[type=text]{
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    font-size:12.5px;
    font-family:var(--font-body);
  }
  .controls label{font-size:11px;color:var(--ink-dim);margin-right:4px;}
  .btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Mapa de Correlativas — Ingeniería en Computación</h1>
      <div class="sub">61 materias · flechas = requisito previo → materia habilitada</div>
    </div>
    <div class="legend">
      <span class="item"><span class="dot" style="background:var(--green)"></span>Aprobada</span>
      <span class="item"><span class="dot" style="background:var(--amber)"></span>En curso / Regularidad</span>
      <span class="item"><span class="dot" style="background:var(--gray)"></span>Pendiente</span>
      <span class="item"><span class="lineswatch" style="border-color:var(--accent)"></span>Requisito para aprobar (final)</span>
      <span class="item"><span class="lineswatch" style="border-color:var(--ink-dim);border-top-style:dashed"></span>Requisito para cursar</span>
    </div>
  </header>

  <div class="controls">
    <label>Año</label>
    <select id="filterYear">
      <option value="">Todos</option>
    </select>
    <label>Estado</label>
    <select id="filterEstado">
      <option value="">Todos</option>
      <option value="aprobado">Aprobada</option>
      <option value="curso">En curso / Regularidad</option>
      <option value="pendiente">Pendiente</option>
    </select>
    <label>Aristas</label>
    <select id="filterEdge">
      <option value="both">Cursar + Aprobar</option>
      <option value="aprobar">Solo Aprobar</option>
      <option value="cursar">Solo Cursar</option>
    </select>
    <input type="text" id="searchBox" placeholder="Buscar materia o código…">
    <button class="btn" id="btnReset">Restablecer vista</button>
    <button class="btn" id="btnPhysics">Congelar layout</button>
  </div>

  <div id="main">
    <div id="network"></div>
    <div id="sidebar"><div class="empty">Hacé click en una materia<br>para ver sus detalles,<br>correlativas y a qué habilita.</div></div>
  </div>
</div>

const COLOR = {
  aprobado: {bg:'#1f4d3c', border:'#3ecf8e', font:'#eafff5'},
  curso:    {bg:'#4d3d1a', border:'#e0a941', font:'#fff6e3'},
  pendiente:{bg:'#1e222b', border:'#454c5c', font:'#c7ccda'},
  root:     {bg:'#232a3a', border:'#5b8cff', font:'#e8eaf0'}
};

function classify(estado){
  const e = (estado||'').toLowerCase();
  if(e.includes('aprobado')) return 'aprobado';
  if(e.includes('en curso') || e.includes('regularidad')) return 'curso';
  return 'pendiente';
}

// build lookup
const nodeById = {};
RAW.nodes.forEach(n => nodeById[n.id] = n);

// requirement index for sidebar detail (aprobar+cursar) grouped
const reqAprobar = {};   // to -> [from...]
const reqCursar = {};
const habilita = {};     // from -> [{to, tipo}]
RAW.edges.forEach(e=>{
  if(e.tipo==='aprobar'){
    (reqAprobar[e.to] = reqAprobar[e.to]||[]).push(e.from);
  } else {
    (reqCursar[e.to] = reqCursar[e.to]||[]).push(e.from);
  }
  (habilita[e.from] = habilita[e.from]||[]).push({to:e.to, tipo:e.tipo});
});

// nodes for vis
const anioLabel = a => (a===null||a===undefined) ? 'Otro' : (a===0 ? 'Optativa' : (a===10 ? 'Formación compl.' : 'Año '+a));

const visNodes = RAW.nodes.map(n=>{
  const cls = n.id==='INFIN' || n.id==='D1001' || n.id==='I1001' ? classify(n.estado) : classify(n.estado);
  const c = COLOR[cls];
  return {
    id: n.id,
    label: n.id + '\n' + wrapLabel(n.nombre, 16),
    title: undefined,
    shape: 'box',
    margin: 10,
    font: {color:c.font, size:12, face:'system-ui', multi:false},
    color: {background:c.bg, border:c.border, highlight:{background:c.bg, border:'#ffffff'}, hover:{background:c.bg,border:'#ffffff'}},
    borderWidth: 1.6,
    shapeProperties:{borderRadius:5},
    group: anioLabel(n.anio),
    _anio: n.anio,
    _estadoClass: cls,
    _data: n
  };
});

function wrapLabel(text, max){
  const words = text.split(' ');
  let lines = [], cur = '';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > max){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur.trim());
  return lines.join('\n');
}

// edges for vis: color by tipo
const visEdges = RAW.edges.map((e,i)=>{
  const isAprobar = e.tipo === 'aprobar';
  return {
    id: 'e'+i,
    from: e.from, to: e.to,
    arrows: 'to',
    color: {color: isAprobar ? '#5b8cff' : '#5b6272', opacity: isAprobar ? 0.85 : 0.55},
    dashes: !isAprobar,
    width: isAprobar ? 1.4 : 1,
    smooth: {type:'cubicBezier', forceDirection:'horizontal', roundness:0.55},
    _tipo: e.tipo
  };
});

// level assignment: use anio (fallback 6 for null / 10 formación)
function levelFor(anio){
  if(anio===null||anio===undefined) return 0;
  if(anio===0) return 6;
  if(anio===10) return 7;
  return anio;
}
visNodes.forEach(n=> n.level = levelFor(n._anio));

const nodesDS = new vis.DataSet(visNodes);
const edgesDS = new vis.DataSet(visEdges);

const container = document.getElementById('network');
const data = {nodes: nodesDS, edges: edgesDS};
const options = {
  layout: {
    hierarchical: {
      enabled: true,
      direction: 'LR',
      sortMethod: 'directed',
      levelSeparation: 230,
      nodeSpacing: 60,
      treeSpacing: 40,
      blockShifting: true,
      edgeMinimization: true,
      parentCentralization: true
    }
  },
  physics: {
    hierarchicalRepulsion: {
      nodeDistance: 90,
      centralGravity: 0,
      springLength: 100,
      springConstant: 0.01,
      damping: 0.6
    },
    minVelocity: 0.75,
    solver: 'hierarchicalRepulsion'
  },
  interaction: {hover:true, tooltipDelay:120, navigationButtons:false, keyboard:true},
  nodes:{ widthConstraint:{minimum:120, maximum:160} }
};

const network = new vis.Network(container, data, options);

network.once('stabilized', ()=>{ /* leave physics on lightly, user can freeze */ });

// ---------- Sidebar ----------
const sidebar = document.getElementById('sidebar');

function estadoPillHTML(cls, text){
  const map = {aprobado:['var(--green-dim)','var(--green)'], curso:['var(--amber-dim)','var(--amber)'], pendiente:['#20242c','var(--ink-dim)']};
  const [bg,fg] = map[cls];
  return `<span class="pill" style="background:${bg};color:${fg};border:1px solid ${fg}44">${text}</span>`;
}

function renderSidebar(id){
  const n = nodeById[id];
  if(!n){ sidebar.innerHTML = '<div class="empty">Materia no encontrada.</div>'; return; }
  const cls = classify(n.estado);
  const estadoTxt = n.estado ? n.estado : 'Sin cursar';

  const aprobarReq = (reqAprobar[id]||[]).map(c=> nodeById[c] ? `<li>${nodeById[c].nombre} <span class="code">(${c})</span></li>` : '');
  const cursarReq = (reqCursar[id]||[]).map(c=> nodeById[c] ? `<li>${nodeById[c].nombre} <span class="code">(${c})</span></li>` : '');
  const desbloq = (habilita[id]||[]).reduce((acc,h)=>{ acc[h.to]=true; return acc; }, {});
  const desbloqList = Object.keys(desbloq).map(c => nodeById[c] ? `<li>${nodeById[c].nombre} <span class="code">(${c})</span></li>` : '');

  sidebar.innerHTML = `
    <h2>${n.nombre}</h2>
    <div class="code">${n.codigo || id}</div>
    <div class="field">
      <label>Estado actual</label>
      ${estadoPillHTML(cls, estadoTxt)}
    </div>
    <div class="field">
      <label>Año / Período</label>
      ${anioLabel(n.anio)}${n.periodo ? ' · '+n.periodo : ''}
    </div>
    <div class="field">
      <label>Para cursar necesita (regularizar o aprobar)</label>
      ${cursarReq.length ? '<ul>'+cursarReq.join('')+'</ul>' : '<span style="color:var(--ink-dim)">Sin requisitos</span>'}
    </div>
    <div class="field">
      <label>Para aprobar el final necesita</label>
      ${aprobarReq.length ? '<ul>'+aprobarReq.join('')+'</ul>' : '<span style="color:var(--ink-dim)">Sin requisitos</span>'}
    </div>
    <div class="field">
      <label>Desbloquea</label>
      ${desbloqList.length ? '<ul>'+desbloqList.join('')+'</ul>' : '<span style="color:var(--ink-dim)">No es requisito de otras materias</span>'}
    </div>
  `;
}

network.on('click', params=>{
  if(params.nodes.length){
    const id = params.nodes[0];
    renderSidebar(id);
    highlightNeighborhood(id);
  } else {
    clearHighlight();
  }
});

function highlightNeighborhood(id){
  const connectedNodes = new Set([id]);
  const connectedEdges = new Set();
  RAW.edges.forEach((e,i)=>{
    if(e.from===id || e.to===id){
      connectedEdges.add('e'+i);
      connectedNodes.add(e.from);
      connectedNodes.add(e.to);
    }
  });
  nodesDS.update(visNodes.map(n=>({
    id:n.id,
    opacity: connectedNodes.has(n.id) ? 1 : 0.15
  })));
  edgesDS.update(visEdges.map(e=>({
    id:e.id,
    hidden: !connectedEdges.has(e.id) && false,
    color: connectedEdges.has(e.id)
      ? {color: e._tipo==='aprobar' ? '#5b8cff':'#8b91a3', opacity: e._tipo==='aprobar'?1:0.9}
      : {color: e._tipo==='aprobar' ? '#5b8cff':'#5b6272', opacity: 0.06}
  })));
}
function clearHighlight(){
  nodesDS.update(visNodes.map(n=>({id:n.id, opacity:1})));
  edgesDS.update(visEdges.map(e=>({
    id:e.id,
    color: e._tipo==='aprobar' ? {color:'#5b8cff', opacity:0.85} : {color:'#5b6272', opacity:0.55}
  })));
}

// ---------- Filters ----------
const years = Array.from(new Set(RAW.nodes.map(n=>n.anio))).sort((a,b)=>{
  if(a===null) return 1; if(b===null) return -1; return a-b;
});
const yearSel = document.getElementById('filterYear');
years.forEach(y=>{
  const opt = document.createElement('option');
  opt.value = (y===null?'null':y);
  opt.textContent = anioLabel(y);
  yearSel.appendChild(opt);
});

function applyFilters(){
  const yv = yearSel.value;
  const ev = document.getElementById('filterEstado').value;
  const edgeMode = document.getElementById('filterEdge').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();

  const visibleNodeIds = new Set();
  visNodes.forEach(n=>{
    let ok = true;
    if(yv !== '' ){
      const yvNorm = yv === 'null' ? null : Number(yv);
      ok = ok && (n._anio === yvNorm);
    }
    if(ev !== ''){ ok = ok && (n._estadoClass === ev); }
    if(q){ ok = ok && (n.id.toLowerCase().includes(q) || n._data.nombre.toLowerCase().includes(q)); }
    if(ok) visibleNodeIds.add(n.id);
  });

  nodesDS.update(visNodes.map(n=>({id:n.id, hidden: !visibleNodeIds.has(n.id)})));
  edgesDS.update(visEdges.map(e=>{
    let hidden = !(visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to));
    if(!hidden && edgeMode !== 'both'){ hidden = e._tipo !== edgeMode; }
    return {id:e.id, hidden};
  }));
}

['filterYear','filterEstado','filterEdge'].forEach(id=>{
  document.getElementById(id).addEventListener('change', applyFilters);
});
document.getElementById('searchBox').addEventListener('input', applyFilters);

document.getElementById('btnReset').addEventListener('click', ()=>{
  yearSel.value=''; document.getElementById('filterEstado').value='';
  document.getElementById('filterEdge').value='both';
  document.getElementById('searchBox').value='';
  applyFilters();
  clearHighlight();
  sidebar.innerHTML = '<div class="empty">Hacé click en una materia<br>para ver sus detalles,<br>correlativas y a qué habilita.</div>';
  network.fit({animation:{duration:400}});
});

let frozen = false;
document.getElementById('btnPhysics').addEventListener('click', (e)=>{
  frozen = !frozen;
  network.setOptions({physics:{enabled: !frozen}});
  e.target.textContent = frozen ? 'Reactivar layout' : 'Congelar layout';
});
</script>
</body>
</html>
